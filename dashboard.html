<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - SllowlyTools</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; }
        .gradient-bg { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); }
        .stat-card:hover { transform: translateY(-3px); transition: transform 0.3s ease; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-spinner { animation: spin 0.6s linear infinite; }
        .bot-log { max-height: 300px; overflow-y: auto; font-family: 'Courier New', monospace; font-size: 12px; }
        .log-success { color: #10b981; }
        .log-error { color: #ef4444; }
        .log-info { color: #3b82f6; }
    </style>
</head>
<body class="bg-slate-900">
    <nav class="bg-slate-800 border-b border-slate-700">
        <div class="container mx-auto px-6 py-4">
            <div class="flex justify-between items-center">
                <div class="text-2xl font-bold bg-gradient-to-r from-emerald-400 to-green-500 bg-clip-text text-transparent">Sllowly<span class="text-white">Tools</span></div>
                <div class="flex items-center space-x-4">
                    <span id="licenseType" class="px-3 py-1 bg-emerald-500/20 rounded-full text-emerald-400 text-sm"></span>
                    <button id="logoutBtn" class="px-4 py-2 bg-red-500/20 text-red-400 rounded-lg hover:bg-red-500/30 transition"><i class="fas fa-sign-out-alt mr-2"></i> Logout</button>
                </div>
            </div>
        </div>
    </nav>
    <div class="container mx-auto px-6 py-8">
        <div class="mb-8"><h1 id="welcomeMessage" class="text-3xl font-bold mb-2"></h1><p id="expiryInfo" class="text-slate-400"></p></div>
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
            <div class="stat-card bg-slate-800 rounded-xl p-6 border border-slate-700"><div class="flex items-center justify-between mb-2"><i class="fas fa-users text-emerald-400 text-2xl"></i><span class="text-2xl font-bold" id="accountsCreated">0</span></div><p class="text-slate-400">Accounts Created</p></div>
            <div class="stat-card bg-slate-800 rounded-xl p-6 border border-slate-700"><div class="flex items-center justify-between mb-2"><i class="fas fa-check-circle text-blue-400 text-2xl"></i><span class="text-2xl font-bold" id="successRate">0%</span></div><p class="text-slate-400">Success Rate</p></div>
            <div class="stat-card bg-slate-800 rounded-xl p-6 border border-slate-700"><div class="flex items-center justify-between mb-2"><i class="fas fa-mobile-alt text-purple-400 text-2xl"></i><span class="text-2xl font-bold" id="activeDevices">0</span></div><p class="text-slate-400">Active Devices</p></div>
            <div class="stat-card bg-slate-800 rounded-xl p-6 border border-slate-700"><div class="flex items-center justify-between mb-2"><i class="fas fa-clock text-orange-400 text-2xl"></i><span class="text-2xl font-bold" id="daysLeft">0</span></div><p class="text-slate-400">Days Remaining</p></div>
        </div>
        <div class="grid lg:grid-cols-2 gap-6 mb-8">
            <div class="bg-slate-800 rounded-xl p-6 border border-slate-700">
                <h3 class="text-xl font-bold mb-4"><i class="fas fa-robot text-emerald-400 mr-2"></i> Facebook Account Creator Bot</h3>
                <div class="space-y-4">
                    <div><label class="block text-sm font-medium mb-2">Number of Accounts</label><input type="number" id="accountCount" class="w-full px-4 py-2 bg-slate-900 border border-slate-600 rounded-lg" value="1" min="1" max="50"></div>
                    <div><label class="block text-sm font-medium mb-2">Custom Password (optional)</label><input type="text" id="customPassword" class="w-full px-4 py-2 bg-slate-900 border border-slate-600 rounded-lg" placeholder="Auto-generated random password"></div>
                    <div><label class="block text-sm font-medium mb-2">Proxy List (optional, one per line)</label><textarea id="proxyList" rows="2" class="w-full px-4 py-2 bg-slate-900 border border-slate-600 rounded-lg" placeholder="http://user:pass@ip:port&#10;socks5://ip:port"></textarea></div>
                    <div class="flex gap-3">
                        <button id="startBotBtn" class="flex-1 py-3 bg-gradient-to-r from-emerald-500 to-green-600 rounded-lg font-semibold hover:shadow-lg transition"><i class="fas fa-play mr-2"></i> Start Bot</button>
                        <button id="stopBotBtn" class="flex-1 py-3 bg-red-600 rounded-lg font-semibold hover:bg-red-700 transition disabled:opacity-50" disabled><i class="fas fa-stop mr-2"></i> Stop Bot</button>
                    </div>
                </div>
            </div>
            <div class="bg-slate-800 rounded-xl p-6 border border-slate-700">
                <h3 class="text-xl font-bold mb-4"><i class="fas fa-terminal text-emerald-400 mr-2"></i> Bot Activity Log</h3>
                <div id="botLog" class="bot-log bg-slate-900 rounded-lg p-3 h-64 overflow-y-auto font-mono text-xs">
                    <div class="log-info">[BOT] Ready to start...</div>
                </div>
                <button id="clearLogBtn" class="mt-3 px-3 py-1 bg-slate-700 rounded text-sm hover:bg-slate-600"><i class="fas fa-trash mr-1"></i> Clear Log</button>
            </div>
        </div>
        <div class="bg-slate-800 rounded-xl p-6 border border-slate-700">
            <h3 class="text-xl font-bold mb-4"><i class="fas fa-list text-emerald-400 mr-2"></i> Created Accounts</h3>
            <div class="overflow-x-auto">
                <table class="w-full">
                    <thead><tr class="border-b border-slate-700"><th class="text-left py-2">UID</th><th class="text-left py-2">Name</th><th class="text-left py-2">Email/Phone</th><th class="text-left py-2">Created</th><th class="text-left py-2">Status</th></tr></thead>
                    <tbody id="accountsTable"><tr><td colspan="5" class="text-center text-slate-400 py-4">No accounts created yet</td></tr></tbody>
                </table>
            </div>
        </div>
    </div>
    <script src="config.js"></script>
    <script src="storage.js"></script>
    <script src="license.js"></script>
    <script src="auth.js"></script>
    <script src="bot.js"></script>
    <script src="dashboard.js"></script>
</body>
</html>
