<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - SllowlyTools</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        * { font-family: 'Inter', sans-serif; }
        .gradient-bg { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); }
        .modal { transition: all 0.3s ease; }
    </style>
</head>
<body class="bg-slate-900">
    <!-- Login Modal -->
    <div id="loginModal" class="fixed inset-0 bg-black/70 flex items-center justify-center z-50">
        <div class="bg-slate-800 rounded-2xl p-8 max-w-md w-full mx-4">
            <div class="text-center mb-6">
                <i class="fas fa-shield-alt text-emerald-400 text-5xl mb-4"></i>
                <h2 class="text-2xl font-bold">Admin Login</h2>
                <p class="text-slate-400 text-sm">Enter your credentials</p>
            </div>
            <form id="adminLoginForm">
                <input type="password" id="adminPassword" placeholder="Password" class="w-full px-4 py-3 bg-slate-900 border border-slate-600 rounded-lg mb-4 focus:border-emerald-500 focus:outline-none">
                <button type="submit" class="w-full py-3 bg-gradient-to-r from-emerald-500 to-green-600 rounded-lg font-semibold">
                    <i class="fas fa-sign-in-alt mr-2"></i> Login
                </button>
            </form>
            <div id="loginError" class="hidden mt-4 bg-red-500/10 border border-red-500 rounded-lg p-2 text-red-400 text-sm text-center"></div>
        </div>
    </div>

    <!-- Main Admin Content (Hidden until login) -->
    <div id="adminContent" class="hidden">
        <nav class="bg-slate-800 border-b border-slate-700 sticky top-0 z-40">
            <div class="container mx-auto px-6 py-4">
                <div class="flex justify-between items-center">
                    <div class="text-2xl font-bold bg-gradient-to-r from-emerald-400 to-green-500 bg-clip-text text-transparent">
                        Sllowly<span class="text-white">Admin</span>
                    </div>
                    <button id="logoutAdminBtn" class="px-4 py-2 bg-red-500/20 text-red-400 rounded-lg hover:bg-red-500/30 transition">
                        <i class="fas fa-sign-out-alt mr-2"></i> Logout
                    </button>
                </div>
            </div>
        </nav>

        <div class="container mx-auto px-6 py-8">
            <!-- Stats Dashboard -->
            <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
                <div class="bg-gradient-to-br from-emerald-500/20 to-emerald-600/20 rounded-xl p-6 border border-emerald-500/30">
                    <p class="text-slate-300 text-sm">Total Active Licenses</p>
                    <p class="text-3xl font-bold" id="totalActive">0</p>
                </div>
                <div class="bg-gradient-to-br from-red-500/20 to-red-600/20 rounded-xl p-6 border border-red-500/30">
                    <p class="text-slate-300 text-sm">Expired Today</p>
                    <p class="text-3xl font-bold" id="expiredToday">0</p>
                </div>
                <div class="bg-gradient-to-br from-green-500/20 to-green-600/20 rounded-xl p-6 border border-green-500/30">
                    <p class="text-slate-300 text-sm">Revenue (USD)</p>
                    <p class="text-3xl font-bold" id="totalRevenue">$0</p>
                </div>
                <div class="bg-gradient-to-br from-blue-500/20 to-blue-600/20 rounded-xl p-6 border border-blue-500/30">
                    <p class="text-slate-300 text-sm">New This Week</p>
                    <p class="text-3xl font-bold" id="newThisWeek">0</p>
                </div>
            </div>

            <!-- Chart -->
            <div class="bg-slate-800 rounded-xl p-6 border border-slate-700 mb-8">
                <h3 class="text-lg font-bold mb-4">License Statistics</h3>
                <canvas id="statsChart" height="100"></canvas>
            </div>

            <!-- Controls -->
            <div class="bg-slate-800 rounded-xl p-6 border border-slate-700 mb-8">
                <div class="flex flex-wrap gap-4 mb-6">
                    <button onclick="generateLicenseModal()" class="px-4 py-2 bg-emerald-600 rounded-lg hover:bg-emerald-700 transition">
                        <i class="fas fa-plus mr-2"></i> Generate License
                    </button>
                    <button onclick="bulkGenerateModal()" class="px-4 py-2 bg-blue-600 rounded-lg hover:bg-blue-700 transition">
                        <i class="fas fa-layer-group mr-2"></i> Bulk Generate
                    </button>
                    <button onclick="exportData()" class="px-4 py-2 bg-purple-600 rounded-lg hover:bg-purple-700 transition">
                        <i class="fas fa-download mr-2"></i> Export Data
                    </button>
                </div>

                <!-- Search and Filters -->
                <div class="flex flex-wrap gap-4 mb-6">
                    <div class="flex-1">
                        <input type="text" id="searchInput" placeholder="Search by key, owner..." class="w-full px-4 py-2 bg-slate-900 border border-slate-600 rounded-lg focus:border-emerald-500 focus:outline-none">
                    </div>
                    <select id="statusFilter" class="px-4 py-2 bg-slate-900 border border-slate-600 rounded-lg">
                        <option value="all">All Status</option>
                        <option value="active">Active</option>
                        <option value="expired">Expired</option>
                        <option value="revoked">Revoked</option>
                    </select>
                    <select id="typeFilter" class="px-4 py-2 bg-slate-900 border border-slate-600 rounded-lg">
                        <option value="all">All Types</option>
                        <option value="basic">Basic</option>
                        <option value="pro">Pro</option>
                        <option value="enterprise">Enterprise</option>
                    </select>
                    <select id="sortBy" class="px-4 py-2 bg-slate-900 border border-slate-600 rounded-lg">
                        <option value="created">Sort by Created</option>
                        <option value="expires">Sort by Expiry</option>
                        <option value="owner">Sort by Owner</option>
                    </select>
                </div>
            </div>

            <!-- Licenses Table -->
            <div class="bg-slate-800 rounded-xl p-6 border border-slate-700 overflow-x-auto">
                <h3 class="text-lg font-bold mb-4">License Management</h3>
                <table class="w-full">
                    <thead>
                        <tr class="border-b border-slate-700">
                            <th class="text-left py-2"><input type="checkbox" id="selectAll"></th>
                            <th class="text-left py-2">License Key</th>
                            <th class="text-left py-2">Status</th>
                            <th class="text-left py-2">Type</th>
                            <th class="text-left py-2">Owner</th>
                            <th class="text-left py-2">Created</th>
                            <th class="text-left py-2">Expires</th>
                            <th class="text-left py-2">Devices</th>
                            <th class="text-left py-2">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="licensesTable">
                        <tr><td colspan="9" class="text-center py-4">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/license.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
